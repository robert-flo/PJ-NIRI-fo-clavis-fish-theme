# Matugen template for clavis-fish-theme/colors.conf.
# Matugen 4.1.0 provides surface_variant/on_surface_variant; these are the
# Material 3 neutral surface pair used by the duration capsule.

[colors]
path_background={{colors.primary.default.hex}}
path_foreground={{colors.on_primary.default.hex}}

git_background={{colors.secondary_container.default.hex}}
git_foreground={{colors.on_secondary_container.default.hex}}

language_background={{colors.tertiary_container.default.hex}}
language_foreground={{colors.on_tertiary_container.default.hex}}

duration_background={{colors.surface_variant.default.hex}}
duration_foreground={{colors.on_surface_variant.default.hex}}

time_background={{colors.primary_container.default.hex}}
time_foreground={{colors.on_primary_container.default.hex}}

error_background={{colors.error_container.default.hex}}
error_foreground={{colors.on_error_container.default.hex}}

connector={{colors.outline.default.hex}}
arrow={{colors.primary.default.hex}}
